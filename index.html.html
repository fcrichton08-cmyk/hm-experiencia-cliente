<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H&M Chile | Nueva Experiencia de Compra & Satisfacción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --hm-red: #E50010;
      --hm-dark: #222222;
      --hm-gray-light: #F9F8F6;
      --hm-gray-border: #E4E4E4;
      --hm-gray-text: #707070;
      --hm-accent-bg: #F4F0EA;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      color: var(--hm-dark);
      background-color: #FFFFFF;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP ANNOUNCEMENT BAR */
    .top-bar {
      background-color: var(--hm-dark);
      color: #FFFFFF;
      text-align: center;
      padding: 9px 16px;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .top-bar span {
      color: #FFD4D7;
      font-weight: 700;
    }

    /* HEADER & BRANDING */
    header {
      border-bottom: 1px solid var(--hm-gray-border);
      background: #FFFFFF;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .hm-logo-svg {
      width: 68px;
      height: 44px;
      fill: var(--hm-red);
    }

    nav.main-nav {
      display: flex;
      gap: 28px;
    }

    nav.main-nav a {
      text-decoration: none;
      color: var(--hm-dark);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav.main-nav a:hover,
    nav.main-nav a.active {
      color: var(--hm-red);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      font-weight: 500;
    }

    .btn-country {
      background: none;
      border: 1px solid var(--hm-gray-border);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: 2px;
    }

    /* HERO STRATEGIC OBJECTIVE BANNER */
    .hero-objective {
      background-color: var(--hm-gray-light);
      border-bottom: 1px solid var(--hm-gray-border);
      padding: 56px 24px 44px;
    }

    .hero-container {
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .strategic-tag {
      display: inline-block;
      background-color: var(--hm-red);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 16px;
      color: var(--hm-dark);
